<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodnotes リンク共有システム</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-800">

  <!-- トースト通知コンテナ -->
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- ログイン画面 -->
  <div id="loginScreen" class="min-h-full flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 space-y-6">
      
      <!-- ロゴ・ヘッダー -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-500/30 mb-2">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Goodnotes 図面共有</h1>
        <p class="text-sm text-slate-500">社内認証コードを入力してログインしてください</p>
      </div>

      <!-- ログインフォーム -->
      <form id="loginForm" class="space-y-4" onsubmit="handleLoginSubmit(event)">
        <div>
          <label for="inputUserName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">ユーザー名</label>
          <input 
            type="text" 
            id="inputUserName" 
            required 
            placeholder="例: 山田太郎" 
            autocomplete="username"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm bg-slate-50 focus:bg-white outline-none"
          >
        </div>

        <div>
          <label for="inputAuthCode" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">認証コード</label>
          <input 
            type="password" 
            id="inputAuthCode" 
            required 
            placeholder="社内共有の認証コード" 
            autocomplete="current-password"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm bg-slate-50 focus:bg-white outline-none"
          >
        </div>

        <div class="pt-2">
          <button 
            type="submit" 
            id="btnLoginSubmit" 
            class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-2 disabled:opacity-50"
          >
            <span id="loginBtnText">ログイン（24時間有効）</span>
            <div id="loginSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          </button>
        </div>

        <div class="text-center pt-2">
          <p class="text-xs text-slate-400">※ログイン後は24時間自動で状態が保持されます。</p>
        </div>
      </form>
    </div>
  </div>

  <!-- メインダッシュボード -->
  <div id="appScreen" class="hidden min-h-full flex-col flex-1">
    
    <!-- ナビゲーションバー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path>
            </svg>
          </div>
          <div>
            <span class="font-bold text-base sm:text-lg text-slate-900 block leading-tight">Goodnotes 共有</span>
            <span class="text-xs text-slate-500 hidden sm:inline">建築図面・現場メモ連携</span>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4">
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span id="currentUserNameDisplay" class="text-xs font-medium text-slate-700">読み込み中...</span>
          </div>

          <button 
            type="button" 
            onclick="openCreateModal()" 
            class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold shadow-sm transition-all"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
            </svg>
            <span>新規登録</span>
          </button>

          <button 
            type="button" 
            onclick="handleLogout()" 
            title="ログアウト"
            class="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

      <!-- コントロールバー -->
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1 max-w-md">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path>
            </svg>
          </div>
          <input 
            type="text" 
            id="searchInput" 
            oninput="handleSearch(this.value)" 
            placeholder="案件名、メモ、登録者名で絞り込み..." 
            class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none shadow-sm transition"
          >
        </div>

        <div class="flex items-center gap-2 self-end sm:self-auto">
          <button 
            type="button" 
            onclick="fetchAuthorizedData(true)" 
            id="btnRefresh" 
            class="inline-flex items-center gap-1.5 px-3 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium rounded-xl shadow-sm transition-colors"
          >
            <svg id="refreshIcon" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"></path>
            </svg>
            <span>再読み込み</span>
          </button>
        </div>
      </div>

      <!-- ローディング -->
      <div id="loadingIndicator" class="py-16 text-center space-y-4">
        <div class="inline-block w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-slate-500">アクセス権限のあるリンクデータを取得しています...</p>
      </div>

      <!-- 空状態 -->
      <div id="emptyState" class="hidden bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center space-y-3">
        <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12l-3-3m0 0l-3 3m3-3v6m-1.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path>
          </svg>
        </div>
        <h3 class="text-base font-semibold text-slate-800">表示できるリンクがありません</h3>
        <p class="text-sm text-slate-500 max-w-sm mx-auto">閲覧可能な案件データがないか、検索条件に一致する項目がありません。</p>
      </div>

      <!-- リンク一覧グリッド -->
      <div id="linksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>

    </main>
  </div>

  <!-- 新規登録モーダル -->
  <div id="createModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-lg w-full p-6 space-y-5 fade-in">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
          </svg>
          Goodnotesリンクの新規登録
        </h3>
        <button type="button" onclick="closeCreateModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <form id="createLinkForm" class="space-y-4" onsubmit="handleCreateLinkSubmit(event)">
        <div>
          <label for="inputMemo" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
            案件名・図面メモ <span class="text-rose-500">*</span>
          </label>
          <input 
            type="text" 
            id="inputMemo" 
            required 
            placeholder="例: ○○邸新築工事 構造伏図・給排水メモ" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition"
          >
        </div>

        <div>
          <label for="inputUrl" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
            Goodnotes 共有URL <span class="text-rose-500">*</span>
          </label>
          <input 
            type="url" 
            id="inputUrl" 
            required 
            placeholder="https://web.goodnotes.com/s/..." 
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition"
          >
          <p class="text-xs text-slate-400 mt-1">※Goodnotesアプリで「共有リンクを作成」したURLを貼り付けてください</p>
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider">閲覧を許可する社内メンバー</label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="checkAllUsers" onchange="toggleAllUsersCheck(this.checked)" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4">
              <span class="text-xs font-medium text-blue-600">「全員」に公開</span>
            </label>
          </div>

          <div id="usersCheckboxesContainer" class="max-h-36 overflow-y-auto p-3 rounded-xl border border-slate-200 bg-slate-50 space-y-2 text-xs">
            <span class="text-slate-400">ユーザー一覧を読み込み中...</span>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
          <button 
            type="button" 
            onclick="closeCreateModal()" 
            class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition"
          >
            キャンセル
          </button>
          <button 
            type="submit" 
            id="btnCreateSubmit" 
            class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-semibold shadow-md shadow-blue-500/20 transition flex items-center gap-2"
          >
            <span id="createBtnText">登録する</span>
            <div id="createSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    /**
     * GASバックエンド連携用デプロイURL
     */
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzJPcpuMdo2l8tM1tirq-BpjISWWre3crwpL8FudBpkiGWsSGQYapc4DbwuKDN010KwbA/exec";

    // グローバル状態
    let currentSession = {
      userName: '',
      token: ''
    };
    let globalLinksData = [];
    let globalUserList = [];

    // ローカルストレージキー定義
    const STORAGE_KEY_USER = 'goodnotes_app_user';
    const STORAGE_KEY_TOKEN = 'goodnotes_app_token';

    // 起動時ライフサイクル
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
    });

    /**
     * 共通通信レイヤー:
     * - GASコンテナ内（google.script.run利用可能）では内部通信を実行
     * - 外部・スタンドアロン実行時は指定のGAS_ENDPOINT_URLへPOSTリクエストを実行
     */
    async function callBackend(action, params = {}) {
      // 1. GAS Web Apps環境（google.script.runが存在する場合）
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          const runner = google.script.run
            .withSuccessHandler((res) => resolve(res))
            .withFailureHandler((err) => reject(err));

          switch (action) {
            case 'login':
              runner.apiLogin(params.name, params.code);
              break;
            case 'verifySession':
              runner.apiVerifySession(params.name, params.token);
              break;
            case 'getAuthorizedData':
              runner.apiGetAuthorizedData(params.name, params.token);
              break;
            case 'createLink':
              runner.apiCreateLink(params.name, params.token, params.data);
              break;
            case 'logout':
              runner.apiLogout(params.name, params.token);
              break;
            default:
              reject(new Error('未定義のアクションです: ' + action));
          }
        });
      }

      // 2. 外部ホスティング・ローカルファイル環境（GAS_ENDPOINT_URLへのPOST送信）
      const payload = {
        action: action,
        ...params
      };

      const response = await fetch(GAS_ENDPOINT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8' // GAS doPostのCORSプリフライト回避用
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`HTTP通信エラー: ${response.status}`);
      }
      return await response.json();
    }

    /**
     * アプリ起動時の自動セッション確認
     */
    function initApp() {
      const storedUser = localStorage.getItem(STORAGE_KEY_USER);
      const storedToken = localStorage.getItem(STORAGE_KEY_TOKEN);

      if (storedUser && storedToken) {
        currentSession.userName = storedUser;
        currentSession.token = storedToken;

        showAppScreen();
        verifySessionAndLoad();
      } else {
        showLoginScreen();
      }
    }

    /**
     * トースト通知（アラートの代替）
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const colors = {
        success: 'bg-emerald-600 text-white shadow-emerald-500/30',
        error: 'bg-rose-600 text-white shadow-rose-500/30',
        info: 'bg-slate-800 text-white shadow-slate-900/30'
      };

      toast.className = `p-4 rounded-xl shadow-lg flex items-center justify-between gap-3 text-sm pointer-events-auto fade-in ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <span class="flex-1 font-medium">${escapeHtml(message)}</span>
        <button class="opacity-70 hover:opacity-100 transition p-1" onclick="this.parentElement.remove()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) {
          toast.remove();
        }
      }, 4000);
    }

    /**
     * ログイン処理
     */
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const userName = document.getElementById('inputUserName').value.trim();
      const authCode = document.getElementById('inputAuthCode').value.trim();

      if (!userName || !authCode) {
        showToast('ユーザー名と認証コードを入力してください', 'error');
        return;
      }

      setLoginLoading(true);

      try {
        const response = await callBackend('login', { name: userName, code: authCode });
        setLoginLoading(false);

        if (response && response.success) {
          currentSession.userName = response.userName;
          currentSession.token = response.token;

          localStorage.setItem(STORAGE_KEY_USER, response.userName);
          localStorage.setItem(STORAGE_KEY_TOKEN, response.token);

          showToast(`ようこそ、${response.userName} さん`, 'success');
          showAppScreen();
          fetchAuthorizedData();
        } else {
          showToast((response && response.message) || '認証に失敗しました。', 'error');
        }
      } catch (err) {
        setLoginLoading(false);
        showToast('通信エラーが発生しました: ' + err.message, 'error');
      }
    }

    /**
     * セッション検証
     */
    async function verifySessionAndLoad() {
      try {
        const res = await callBackend('verifySession', {
          name: currentSession.userName,
          token: currentSession.token
        });

        if (res && res.success) {
          fetchAuthorizedData();
        } else {
          showToast((res && res.message) || 'セッションの有効期限が切れました。', 'info');
          clearSessionAndShowLogin();
        }
      } catch (err) {
        showToast('セッション確認中にエラーが発生しました。', 'error');
        clearSessionAndShowLogin();
      }
    }

    /**
     * ログアウト
     */
    async function handleLogout() {
      if (currentSession.userName && currentSession.token) {
        try {
          await callBackend('logout', { name: currentSession.userName, token: currentSession.token });
        } catch (e) {}
      }
      clearSessionAndShowLogin();
      showToast('ログアウトしました', 'info');
    }

    function clearSessionAndShowLogin() {
      localStorage.removeItem(STORAGE_KEY_USER);
      localStorage.removeItem(STORAGE_KEY_TOKEN);
      currentSession = { userName: '', token: '' };
      showLoginScreen();
    }

    /**
     * データ一覧取得
     */
    async function fetchAuthorizedData(isManualRefresh = false) {
      const loading = document.getElementById('loadingIndicator');
      const grid = document.getElementById('linksGrid');
      const empty = document.getElementById('emptyState');
      const refreshIcon = document.getElementById('refreshIcon');

      loading.classList.remove('hidden');
      grid.classList.add('hidden');
      empty.classList.add('hidden');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const response = await callBackend('getAuthorizedData', {
          name: currentSession.userName,
          token: currentSession.token
        });

        loading.classList.add('hidden');
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');

        if (!response || !response.success) {
          if (response && response.sessionExpired) {
            clearSessionAndShowLogin();
            showToast('セッションの有効期限が切れました。', 'error');
          } else {
            showToast((response && response.message) || 'データの取得に失敗しました。', 'error');
          }
          return;
        }

        globalLinksData = response.links || [];
        globalUserList = response.userList || [];
        renderUserCheckboxes(globalUserList);
        renderLinks(globalLinksData);

        if (isManualRefresh) {
          showToast('データを最新に更新しました', 'success');
        }
      } catch (err) {
        loading.classList.add('hidden');
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
        showToast('データ取得エラー: ' + err.message, 'error');
      }
    }

    /**
     * カード一覧の描画
     */
    function renderLinks(links) {
      const grid = document.getElementById('linksGrid');
      const empty = document.getElementById('emptyState');

      grid.innerHTML = '';

      if (!links || links.length === 0) {
        empty.classList.remove('hidden');
        grid.classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.classList.remove('hidden');

      links.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-200 transition-all p-5 flex flex-col justify-between space-y-4';

        const isPublicToAll = item.allowedUsers.includes('全員');
        const allowedBadgeHtml = isPublicToAll 
          ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">全員公開</span>'
          : `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-200" title="${escapeHtml(item.allowedUsers.join(', '))}">指定メンバー (${item.allowedUsers.length}名)</span>`;

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between gap-2">
              ${allowedBadgeHtml}
              <span class="text-xs text-slate-400 font-mono">${escapeHtml(item.createdAt || '')}</span>
            </div>

            <div>
              <h4 class="text-base font-bold text-slate-900 leading-snug line-clamp-2">${escapeHtml(item.memo)}</h4>
            </div>

            <div class="flex items-center gap-1.5 text-xs text-slate-500">
              <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
              </svg>
              <span>登録者: <strong class="text-slate-700 font-medium">${escapeHtml(item.createdBy)}</strong></span>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-center gap-2">
            <a 
              href="${escapeHtml(item.url)}" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="flex-1 py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-xs text-center shadow-sm flex items-center justify-center gap-1.5 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"></path>
              </svg>
              <span>Goodnotesで開く</span>
            </a>

            <button 
              type="button" 
              onclick="copyToClipboard('${escapeHtml(item.url)}')" 
              title="URLをコピー" 
              class="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 active:bg-slate-100 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.849A1.996 1.996 0 0014.5 3.5h-5c-.407 0-.785.122-1.1.332M15.666 3.849A1.996 1.996 0 0118 5.5v13a2 2 0 01-2 2H8a2 2 0 01-2-2V5.5c0-.684.344-1.288.87-1.651M15.666 3.849a1.996 1.996 0 00-1.166-.349h-5c-.418 0-.805.127-1.127.346m8.293 0L15 4.5m-6 0l-.707-.651M9 11.25h6m-6 3.75h4.5"></path>
              </svg>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    /**
     * 検索フィルター
     */
    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderLinks(globalLinksData);
        return;
      }

      const filtered = globalLinksData.filter((item) => {
        const memo = (item.memo || '').toLowerCase();
        const createdBy = (item.createdBy || '').toLowerCase();
        const allowed = (item.allowedUsers || []).join(' ').toLowerCase();
        return memo.includes(q) || createdBy.includes(q) || allowed.includes(q);
      });

      renderLinks(filtered);
    }

    function openCreateModal() {
      document.getElementById('createLinkForm').reset();
      document.getElementById('checkAllUsers').checked = true;
      toggleAllUsersCheck(true);
      document.getElementById('createModal').classList.remove('hidden');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
    }

    function renderUserCheckboxes(users) {
      const container = document.getElementById('usersCheckboxesContainer');
      container.innerHTML = '';

      if (!users || users.length === 0) {
        container.innerHTML = '<span class="text-slate-400">登録ユーザーが見つかりません</span>';
        return;
      }

      users.forEach((userName) => {
        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 cursor-pointer transition';
        label.innerHTML = `
          <input type="checkbox" name="allowedUserCheckbox" value="${escapeHtml(userName)}" class="user-check-item rounded text-blue-600 focus:ring-blue-500 w-4 h-4" disabled>
          <span class="text-slate-700 text-xs">${escapeHtml(userName)}</span>
        `;
        container.appendChild(label);
      });
    }

    function toggleAllUsersCheck(isAllChecked) {
      const checkboxes = document.querySelectorAll('.user-check-item');
      checkboxes.forEach((cb) => {
        cb.disabled = isAllChecked;
        if (isAllChecked) cb.checked = false;
      });
    }

    /**
     * 新規リンク作成送信
     */
    async function handleCreateLinkSubmit(e) {
      e.preventDefault();
      const memo = document.getElementById('inputMemo').value.trim();
      const url = document.getElementById('inputUrl').value.trim();
      const isAll = document.getElementById('checkAllUsers').checked;

      let allowedUsers = [];
      if (isAll) {
        allowedUsers = ['全員'];
      } else {
        const checkedNodes = document.querySelectorAll('.user-check-item:checked');
        checkedNodes.forEach((node) => allowedUsers.push(node.value));
        if (!allowedUsers.includes(currentSession.userName)) {
          allowedUsers.push(currentSession.userName);
        }
      }

      if (allowedUsers.length === 0) {
        showToast('少なくとも1名以上の閲覧可能ユーザーを選択するか、「全員」をチェックしてください', 'error');
        return;
      }

      setCreateLoading(true);

      const payload = {
        memo: memo,
        url: url,
        allowedUsers: allowedUsers
      };

      try {
        const res = await callBackend('createLink', {
          name: currentSession.userName,
          token: currentSession.token,
          data: payload
        });

        setCreateLoading(false);
        if (res && res.success) {
          showToast('Goodnotesリンクを登録しました', 'success');
          closeCreateModal();
          fetchAuthorizedData();
        } else {
          showToast((res && res.message) || '登録に失敗しました', 'error');
        }
      } catch (err) {
        setCreateLoading(false);
        showToast('登録通信エラー: ' + err.message, 'error');
      }
    }

    /**
     * クリップボードコピー
     */
    function copyToClipboard(text) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (successful) {
          showToast('Goodnotes共有リンクをコピーしました', 'success');
        } else {
          showToast('コピーに失敗しました。手動でコピーしてください。', 'error');
        }
      } catch (err) {
        showToast('コピーできませんでした: ' + err.message, 'error');
      }
    }

    function showAppScreen() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('appScreen').classList.add('flex');
      document.getElementById('currentUserNameDisplay').textContent = currentSession.userName;
    }

    function showLoginScreen() {
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('flex');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('inputAuthCode').value = '';
    }

    function setLoginLoading(isLoading) {
      const btn = document.getElementById('btnLoginSubmit');
      const text = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');
      btn.disabled = isLoading;
      text.textContent = isLoading ? '照合中...' : 'ログイン（24時間有効）';
      spinner.classList.toggle('hidden', !isLoading);
    }

    function setCreateLoading(isLoading) {
      const btn = document.getElementById('btnCreateSubmit');
      const text = document.getElementById('createBtnText');
      const spinner = document.getElementById('createSpinner');
      btn.disabled = isLoading;
      text.textContent = isLoading ? '登録中...' : '登録する';
      spinner.classList.toggle('hidden', !isLoading);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
